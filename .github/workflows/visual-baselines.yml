name: Update visual regression baselines

# Manually triggered: run this after an intentional UI change so the
# committed baselines (generated on ubuntu-latest, matching the `visual`
# job in ci.yml) stay in sync. Download the "visual-baselines" artifact
# from the run and commit its contents over e2e-visual/**/*-snapshots/.
on:
  workflow_dispatch:

jobs:
  update-baselines:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Update snapshots
        run: npm run test:visual -- --update-snapshots
        env:
          E2E_USER1_EMAIL: ${{ secrets.E2E_USER1_EMAIL }}
          E2E_USER1_PASSWORD: ${{ secrets.E2E_USER1_PASSWORD }}

      - name: Upload updated baselines
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: e2e-visual/**/*-snapshots/**
          retention-days: 7
